# Builds the installer on GitHub and publishes the release when release.ps1 pushes a version tag.
# The tag's message holds the release notes (the in-app "What's new" window shows them).
# A push to a claude/* or test/* branch runs the same build as a test and keeps the installer as an artifact.
name: Release

on:
  push:
    tags: ['v*']
    branches: ['claude/**', 'test/**']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Our small LGPL ffmpeg for recording (ffmpeg/build.sh); build.ps1 bundles it into capture\.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm

      - name: Build ffmpeg-capture
        shell: msys2 {0}
        run: sh ffmpeg/build.sh "$(pwd)/ffmpeg/.work"

      # Our patch must be in it (output_rate, nv12); a build without it would quietly record the old way.
      - name: Check ffmpeg-capture
        shell: msys2 {0}
        run: |
          help=$(ffmpeg/.work/out/ffmpeg-capture.exe -hide_banner -h filter=gfxcapture)
          echo "$help" | grep -q output_rate && echo "$help" | grep -q nv12 || { echo "ffmpeg-capture lacks the gfxcapture patch"; exit 1; }

      - name: Run tests
        run: dotnet test tests/ReplayRecorder.Tests -c Release

      - name: Build installer
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '' }
          ./build.ps1 -Version $v

      - name: Keep test installer
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: |
            dist/ReplayRecorder-Setup.exe
            ffmpeg/.work/out/ffmpeg-capture.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # checkout keeps only the commit; fetch the annotated tag itself to read its message
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          [Console]::OutputEncoding = [Text.Encoding]::UTF8  # keep Turkish letters in the notes intact
          git tag -l --format='%(contents)' $tag | Set-Content -Encoding utf8 notes.md
          gh release create $tag dist/ReplayRecorder-Setup.exe --title "Replay Recorder $($tag.TrimStart('v'))" --notes-file notes.md
