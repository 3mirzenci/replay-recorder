<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurora sketches v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Aurora v2: same look, with the layout fixes applied (see the note under the window). */
:root{color-scheme:dark;--accent:#FFC21A;--on:#141210;--gs:10%;
--page:#0E0E0F;--bg:#070708;--raise:#111113;--text:#F2F2F3;--sub:#A3A3A8;--faint:#85858B;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.08);--edge:#262628;
--game:#B9B9C0;--discord:#7B86FF;--danger:#FF7A72;
--ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--disp:Bahnschrift,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--num:Bahnschrift,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--ui);padding:24px 16px 60px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--disp);font-size:24px;margin:0;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;color:var(--sub);font-size:13px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button[aria-pressed=true]{border-color:var(--text)}
.tabs{display:flex;gap:6px}
.tabs button{background:var(--glass);color:var(--sub);border:0;border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--text);color:var(--bg)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.scroll{overflow-x:auto;border-radius:12px}
.win{min-width:1060px;position:relative;background:var(--bg);border:1px solid var(--edge);border-radius:12px;overflow:hidden;isolation:isolate}
.glow{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(95% 55% at 50% 0%,color-mix(in srgb,var(--accent) var(--gs),transparent),transparent 75%)}
/* grain: a tiled noise image over the glow only, to hide gradient banding */
.grain{position:absolute;inset:0;pointer-events:none;z-index:0;background-image:var(--noise);-webkit-mask-image:radial-gradient(95% 55% at 50% 0%,#000,transparent 75%);mask-image:radial-gradient(95% 55% at 50% 0%,#000,transparent 75%)}
.view{position:relative;z-index:1;padding:0 30px 30px}
.top{display:flex;align-items:center;gap:18px;height:58px;font-size:13px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:15.5px}
.logo b{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo b::after{content:"";border-left:8px solid var(--on);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--text)}
.seg{display:flex;gap:4px}
.seg button{font:inherit;font-size:13px;padding:6px 11px;border:0;border-radius:999px;background:none;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button em{font-style:normal;color:var(--faint);margin-left:6px;font-family:var(--num)}
.seg button[aria-pressed=true]{background:var(--glass2);color:var(--text)}
.seg.sm button{font-size:12.5px;padding:5px 10px}
.search{margin-left:auto;width:230px;color:var(--sub)}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
.wc{display:flex;margin-right:-30px;align-self:flex-start}.wc span{width:46px;height:34px;display:grid;place-items:center;color:var(--sub);font-size:12px}
.hero{display:flex;align-items:baseline;gap:14px;margin-top:22px}
.hero .big{font-family:var(--disp);font-size:36px;font-weight:600}
.hero .meta{color:var(--sub);font-size:14px}
.hero .seg{margin-left:auto;align-self:center}
.day{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
.day .c{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint)}
.day b{font-family:var(--disp);font-size:18px;font-weight:600}.day span{color:var(--sub);font-size:13px}
/* tiles stretch to fill the row; four columns at this width, more on a wider window */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px 18px}
.card{cursor:pointer}
.th{position:relative;border-radius:12px;aspect-ratio:16/9;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;box-shadow:0 0 0 1px var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-family:var(--num);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px}
.new{position:absolute;left:8px;bottom:8px;background:var(--accent);color:var(--on);font-family:var(--num);font-size:11px;font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.chk,.star{position:absolute;top:8px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);opacity:0;transition:opacity .15s;display:grid;place-items:center;color:#fff;font-size:12px}
.chk{left:8px;border:1.5px solid rgba(255,255,255,.85)}.star{right:8px}
.scrub{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);transition:width .1s}
.card:hover .th{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 18px 34px -18px color-mix(in srgb,var(--accent) 45%,transparent)}
.card:hover .chk,.card:hover .star{opacity:1}
.card.sel .th{box-shadow:0 0 0 2px var(--accent)}
.card.sel .chk{opacity:1;background:var(--accent);border-color:var(--accent);color:var(--on)}
.info{padding:10px 2px 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.info b{font-size:14px;font-weight:600}.info .t{color:var(--sub);font-size:13px;font-family:var(--num);margin-left:6px}
.info .r{color:var(--faint);font-size:12px;white-space:nowrap;opacity:0;transition:opacity .15s}
.card:hover .info .r,.card.sel .info .r{opacity:1}
/* player */
.back{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--glass)}
.pt b{display:block;font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.15}.pt span{color:var(--sub);font-size:12.5px}
.btn{border-radius:999px;padding:8px 15px;font-size:13px;background:var(--glass);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.btn.del{color:var(--danger)}
.btn.acc{background:var(--accent);color:var(--on);font-weight:700;border-color:var(--accent);padding:10px 18px;font-size:14px}
.stage{position:relative;margin:14px auto 0;width:86%}
.stage .vd{position:relative;display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--line),0 30px 120px -20px color-mix(in srgb,var(--accent) calc(var(--gs) * 3),transparent)}
.tlw{margin-top:26px;position:relative}
#tl{display:block;width:100%;height:118px;cursor:pointer;touch-action:none}
/* each volume slider sits at the end of its own track */
.lanes{position:absolute;right:0;top:8px;width:150px;display:flex;flex-direction:column;gap:6px}
.ls{height:26px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--sub)}
.ls p{flex:1;margin:0;height:4px;border-radius:2px;background:var(--line);position:relative}
.ls p::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--v);background:var(--c);border-radius:2px}
.ls p::after{content:"";position:absolute;left:calc(var(--v) - 7px);top:-5px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.ls span{width:38px;text-align:right;font-family:var(--num)}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:14px;gap:16px}
.tb{display:flex;gap:6px}.tb .btn{padding:7px 12px}
.tr{display:flex;align-items:center;gap:12px}
.rb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--glass)}
.play{width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.play::after{content:"";border-left:15px solid var(--on);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.tm{font-family:var(--num);font-size:16px;margin-left:4px}.tm span{color:var(--sub)}
.ex{display:flex;gap:14px;align-items:center;justify-content:flex-end}
.ro{text-align:right;line-height:1.25}.ro b{display:block;font-family:var(--num);font-size:16px;font-weight:600}.ro span{color:var(--sub);font-size:12px;white-space:nowrap}
.note{color:var(--sub);font-size:13px;margin:6px 0 0;line-height:1.5}
/* equal-width digits so times do not jitter */
.tm,.dur,.info .t,.ro b,.ls span,.seg em{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 <div class="ctl"><div class="tb"><span class="btn">Set start&nbsp; I</span><span class="btn">Set end&nbsp; O</span><span class="btn">Preview trim&nbsp; P</span><span class="btn" style="background:none;border-color:transparent;color:var(--sub)">Reset</span></div>
 <div class="tr"><span class="rb">&#9198;</span><span class="play"></span><span class="rb">&#9197;</span><span class="rb" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></span><span class="tm"><span id="hd" style="color:var(--text)">0:23.0</span> <span>/ 1:02</span></span></div>
 <div class="ex"><div class="ro"><b id="roq"></b><span id="rot"></span></div><span class="btn acc">&#8593; Export for Discord</span></div></div>`}

// made-up loudness curves (0..1), smoothed so they read as sound, with silent gaps for voice tracks
function track(seed,speech){let s=seed;const r=()=>(s=(s*9301+49297)%233280)/233280;const n=240,a=[];let on=!speech,run=0;
 for(let i=0;i<n;i++){if(speech&&run--<=0){on=!on;run=6+r()*(on?22:30)}a.push(on?(speech?.35+r()*.6:.45+r()*.4):0)}
 for(let k=0;k<3;k++)for(let i=1;i<n-1;i++)a[i]=(a[i-1]+a[i]*2+a[i+1])/4;return a}
const TR=[{n:"Game",c:"--game",d:track(7,0)},{n:"Mic",c:"--accent",d:track(3,1)},{n:"Discord",c:"--discord",d:track(11,1)}];
const DUR=62;let tin=.14,tout=.82,head=.37;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function fmt(s){return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
// the app's real ladder: 19.5 MB target, minus 128 kbps audio and 2% overhead
function readout(){const q=document.getElementById("roq");if(!q)return;const kept=(tout-tin)*DUR,mb=(19.5*8000*.98/kept-128)/1000;
 q.textContent=mb>=6?"1080p60":mb>=3?"720p60":mb>=1.5?"720p30":mb>=.8?"480p30":"360p30";
 document.getElementById("rot").textContent=fmt(kept)+" kept · 19.5 MB";
 document.getElementById("hd").textContent=fmt(head*DUR)+"."+Math.floor(head*DUR*10%10)}
function draw(){const cv=document.getElementById("tl");if(!cv)return;const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
 const L=64,R=W-170,lane=26,gap=6,top=8,x=t=>L+t*(R-L);
 g.font='11px "Segoe UI Variable Text","Segoe UI",sans-serif';g.textBaseline="middle";
 TR.forEach((t,k)=>{const y0=top+k*(lane+gap),mid=y0+lane/2,col=css(t.c);
  g.fillStyle=css("--sub");g.fillText(t.n,0,mid);
  g.fillStyle="rgba(255,255,255,.035)";g.beginPath();g.roundRect(L,y0,R-L,lane,6);g.fill();
  const inT=px=>px>=x(tin)&&px<=x(tout);
  g.fillStyle=col;for(let px=L+1;px<R-2;px+=4){const i=Math.round((px-L)/(R-L)*(t.d.length-1)),v=t.d[i];
   const bh=v*lane;if(bh<1)continue;g.globalAlpha=inT(px)?.95:.22;g.beginPath();g.roundRect(px,mid-bh/2,2,bh,1);g.fill()}g.globalAlpha=1});
 const bottom=top+3*lane+2*gap;
 g.strokeStyle=css("--accent");g.lineWidth=2;g.beginPath();g.roundRect(x(tin),top-4,x(tout)-x(tin),bottom-top+8,8);g.stroke();
 [tin,tout].forEach(t=>{g.fillStyle=css("--accent");g.beginPath();g.roundRect(x(t)-5,top+lane/2+6,10,lane+gap+lane/2,5);g.fill();g.fillStyle=css("--on");g.fillRect(x(t)-1,top+lane+gap,2,lane-4)});
 g.fillStyle="#fff";g.fillRect(x(head)-1,top-8,2,bottom-top+14);g.beginPath();g.arc(x(head),top-8,5,0,7);g.fill();
 g.fillStyle=css("--faint");g.textAlign="center";["0:00","0:10","0:20","0:30","0:40","0:50","1:02"].forEach((s,i)=>g.fillText(s,x(i/6),bottom+16));g.textAlign="left";
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect(),p0=e.clientX-r.left;
  const what=Math.abs(p0-x(tin))<10?"in":Math.abs(p0-x(tout))<10?"out":"head";
  const mv=ev=>{const t=Math.min(1,Math.max(0,(ev.clientX-cv.getBoundingClientRect().left-L)/(R-L)));
   if(what=="in")tin=Math.min(t,tout-.05);else if(what=="out")tout=Math.max(t,tin+.05);else head=t;draw();readout()};
  mv(e);cv.setPointerCapture(e.pointerId);cv.onpointermove=mv;cv.onpointerup=()=>cv.onpointermove=null};
 readout()}

let VIEW="lib";
function render(v){VIEW=v;const w=document.getElementById("w");w.innerHTML=`<div class="glow"></div><div class="grain" id="grain"></div><div class="view">${v=="ply"?ply():lib()}</div>`;
 document.getElementById("grain").style.display=document.getElementById("gr").checked?"":"none";
 if(v=="ply")draw();else{w.querySelectorAll(".th").forEach(t=>{const bar=t.querySelector(".scrub");t.onmousemove=e=>{const r=t.getBoundingClientRect();bar.style.width=((e.clientX-r.left)/r.width*100)+"%"};t.onmouseleave=()=>bar.style.width="0"});
  w.querySelectorAll("#gf button").forEach(b=>b.onclick=()=>{FILTER=b.dataset.g;render("lib")})}}
// text on accent: pick dark or white by which has more contrast (the fix from the plan), not by brightness
function lum(r,g,b){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function setA(c){const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);const s=document.documentElement.style;const l=lum(r,g,b);
 const cd=(l+.05)/(lum(20,18,16)+.05),cw=1.05/(l+.05);s.setProperty("--accent",c);s.setProperty("--on",cd>=cw?"#141210":"#FFFFFF");draw()}
// grain: one small noise tile, made once
(function(){const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d"),d=g.createImageData(128,128);
 for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=255;d.data[i+3]=Math.random()*9}g.putImageData(d,0,0);
 document.documentElement.style.setProperty("--noise","url("+c.toDataURL()+")")})();
document.querySelectorAll("#vt button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#vt button").forEach(x=>x.setAttribute("aria-pressed",x==b));render(b.dataset.v)});
document.querySelectorAll(".sw button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".sw button").forEach(x=>x.setAttribute("aria-pressed",x==b));document.getElementById("anyc").value=b.dataset.a;setA(b.dataset.a)});
document.getElementById("anyc").oninput=e=>{document.querySelectorAll(".sw button").forEach(x=>x.setAttribute("aria-pressed","false"));setA(e.target.value)};
document.getElementById("gs").oninput=e=>{document.documentElement.style.setProperty("--gs",e.target.value+"%");document.getElementById("gso").textContent=e.target.value+"%"};
document.querySelectorAll("#tf button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tf button").forEach(x=>x.setAttribute("aria-pressed",x==b));document.documentElement.style.setProperty("--disp",b.dataset.f)});
document.getElementById("gr").onchange=()=>render(VIEW);
addEventListener("resize",draw);
render("lib");
</script>
